name: Desktop applications
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'scripts/**'
      - 'public/**'
      - 'licenses/**'
      - 'LICENSE'
      - 'src/**'
      - 'tests/**'
      - '*config*'
      - 'package*.json'
      - '.github/workflows/desktop.yml'
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    # In a private repository, Mac runners are billed at about ten times the Linux rate.
    # Until the repository is public, desktop builds run only when started by hand.
    if: github.event_name != 'pull_request' || !github.event.repository.private
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: x64
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: ubuntu-24.04
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          architecture: ${{ matrix.arch }}
          cache: npm
      - run: npm run setup
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:tooling
      - run: npm run desktop:prepare
      - run: npm run desktop:pack
      # Linux has no display on the runner, and Ubuntu 24.04 restricts the user
      # namespaces that Chromium's sandbox uses unless this is relaxed.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          npx playwright install-deps chromium
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - if: runner.os != 'Linux'
        run: npm run test:desktop:packaged
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop:packaged
      - run: npm run desktop:dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Fussenn-${{ runner.os }}-${{ matrix.arch }}
          # Unsigned test builds, about 1 GB per run. GitHub Free includes
          # 500 MB of artifact storage for private repositories, accrued hourly.
          retention-days: 3
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: desktop-test-results-${{ runner.os }}-${{ matrix.arch }}
          path: test-results/desktop
