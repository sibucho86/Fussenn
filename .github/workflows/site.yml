name: Download page
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'public/brand/**'
      - 'scripts/site-build.mjs'
      - 'scripts/release-assets.mjs'
      - '.github/workflows/site.yml'
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    # GitHub Pages and public release downloads need a public repository on GitHub Free.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
      # The page shows the latest release: its version, date, file sizes and SHA-256.
      - name: Read the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p .site-release
          gh release view --json tagName,publishedAt,assets > .site-release/release.json
          gh release download --pattern SHA256SUMS.txt --dir .site-release
      - run: node scripts/site-build.mjs --out _site --release-json .site-release/release.json --sums .site-release/SHA256SUMS.txt
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
